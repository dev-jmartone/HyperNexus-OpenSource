<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HyperNexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--c-bg);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.10) 0%, transparent 60%);
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--c-accent), var(--c-purple));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px;
      box-shadow: 0 0 40px rgba(59,130,246,0.3);
    }

    .login-logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--c-text);
    }

    .login-logo p {
      color: var(--c-text3);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .login-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      padding: 32px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-lg);
    }

    .login-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--c-text2);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 8px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--c-accent), var(--c-purple));
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s, transform 0.15s;
    }

    .login-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(59,130,246,0.35);
    }

    .login-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--c-red);
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--c-text3);
    }
  </style>
</head>
<body>
  <div class="login-wrapper fade-in">
    <div class="login-logo">
      <div class="logo-icon">⚡</div>
      <h1>HyperNexus</h1>
      <p>Multi-Hypervisor & VDI Control Plane</p>
    </div>

    <div class="login-card">
      <h2>Iniciar sesión</h2>

      {% if error %}
      <div class="login-error">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input type="text" id="username" name="username" class="form-control"
                 placeholder="usuario" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn">Ingresar →</button>
      </form>
    </div>

    <div class="login-footer">
      VDI Inventory Hub &nbsp;·&nbsp; Enterprise Orchestrator
    </div>
  </div>
</body>
</html>
